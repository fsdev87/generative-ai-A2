services:
  app:
    build: .
    image: trialmatch-app
    ports:
      - "8000:8000"
    environment:
      # Fine-tuned LoRA adapter: a Hugging Face Hub repo id or a path inside the container.
      # Set ADAPTER= (empty) in a .env file to run the untuned base model instead.
      ADAPTER: ${ADAPTER-farazmust123/qwen2.5-1.5b-trialgpt-lora}
      ANSWER_ORDER: ${ANSWER_ORDER:-label_first}
      TARGET_MODEL: ${TARGET_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}
      DRAFT_MODEL: ${DRAFT_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
      DTYPE: ${DTYPE:-float32}
      MAX_NEW_TOKENS: ${MAX_NEW_TOKENS:-64}
      SPEC_K: ${SPEC_K:-4}
    volumes:
      - hf-models:/models          # model weights are downloaded once and kept here
      - ./reports:/srv/reports     # saved screening reports persist on the host
    restart: unless-stopped

volumes:
  hf-models:
